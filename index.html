<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturbesök</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#eef0ea;--card:#f9faf6;--ink:#22302b;--mute:#5f6d66;--line:#c9d1c4;--moss:#4f6b4a;--bark:#7a5c3e;--warn:#9a4a2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font:600 1.9rem/1.15 "Iowan Old Style",Charter,Georgia,serif;margin:.2rem 0 1rem}
h2{font:600 1.15rem/1.3 "Iowan Old Style",Charter,Georgia,serif;margin:2rem 0 .5rem}
label{display:block;color:var(--mute);font-size:.9rem;margin-bottom:.25rem}
input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--moss);padding:.65rem 1rem;background:var(--moss);color:#fff}
button.ghost{background:transparent;color:var(--moss)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--bark);outline-offset:2px}
#find{width:100%;margin:1rem 0 .5rem;padding:.9rem;font-size:1.05rem}
#status{color:var(--mute);min-height:1.5rem;margin:.25rem 0}
#status.warn,.err{color:var(--warn)}
.hit{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);border-radius:6px;padding:.8rem 1rem;margin:.6rem 0;display:flex;gap:.75rem;align-items:center}
.hit.other{border-left-color:var(--line)}
.hit div{flex:1;min-width:0}
.hit strong{display:block;overflow-wrap:anywhere}
.hit span,.v span{color:var(--mute);font-size:.9rem}
.hit.done{border-left-color:var(--bark)}
.v{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
#more{margin-top:.5rem}
#map{height:55vh;min-height:320px;border:1px solid var(--line);border-radius:6px;margin-top:.6rem;background:var(--card);color:var(--mute)}
#loc{width:100%}
h3{font:600 1rem/1.3 "Iowan Old Style",Charter,Georgia,serif;margin:1.3rem 0 .1rem}
h3 span{color:var(--mute);font:400 .9rem system-ui,sans-serif}
</style>
</head>
<body>
<main>
<h1>Naturbesök</h1>
<label for="user">Ditt namn</label>
<input id="user" autocomplete="name" placeholder="Så här sparas dina besök">
<button id="find">Var är jag?</button>
<p id="status" aria-live="polite"></p>
<div id="hits"></div>
<button id="more" class="ghost" hidden></button>
<div id="other" hidden></div>
<h2>Karta</h2>
<button id="loc" class="ghost">Centrera på min position</button>
<div id="map" role="region" aria-label="Karta"></div>
<button id="vb" class="ghost" style="width:100%;margin-top:1.5rem">Mina besök</button>
<div id="visits" hidden></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Inställningar ----
const CFG = {
  wfs: "https://geodata.naturvardsverket.se/inspire/ps/wfs",
  wms: "https://geodata.naturvardsverket.se/inspire/ps-nvr/ows",
  sheet: "https://script.google.com/macros/s/AKfycbxUgd9WFye-hGfQng3-3-ZOWgJeh9NlrY05J7FRxAVoo9jpACvl8NhU1zCw7zxQGUFGIw/exec"
};

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let user = store.get("user", ""), visits = store.get("visits:" + user, []), pos = null, hits = [];
function setUser(n){
  n = n.trim(); if (n === user) return;
  user = n; store.set("user", user);
  visits = store.get("visits:" + user, []);
  if (pins) pins.clearLayers();
  render(); sync();
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function label(scheme, des){
  if (scheme === "IUCN") return des === "nationalPark" ? "Nationalpark" : "Naturreservat";
  if (scheme === "natura2000") return "Natura 2000";
  if (scheme === "ramsar") return "Ramsar";
  if (scheme.startsWith("UNESCO")) return "Biosfärområde";
  return des || scheme || "Skyddat område";
}

function flat(f){
  const p = f.properties || {}, d = p.siteDesignation?.DesignationType || {};
  const lid = p.inspireID?.localId || f.id;
  const n2k = lid.match(/^(SE\.SWEPA\.SE\d+)\.\d+$/); // .1 och .2 är två direktiv för samma område
  const scheme = d.designationScheme?.["@href"] || "", des = d.designation?.["@href"] || "";
  const raw = p.siteName?.GeographicalName?.spelling?.text || "Namnlöst område";
  const rn = raw.match(/^(\d{5,})\s+(.*)$/);
  const id = n2k ? n2k[1] : lid;
  return { key: scheme + ":" + id, id, scheme, des, name: rn ? rn[2] : raw, typ: label(scheme, des), skydd: scheme === "IUCN", nvrid: rn ? rn[1] : "" };
}

function setStatus(t, warn){ const s = $("#status"); s.textContent = t; s.className = warn ? "warn" : ""; }

function find(){
  setUser($("#user").value);
  if (!user) { setStatus("Skriv ditt namn först.", true); $("#user").focus(); return; }
  if (!navigator.geolocation) { setStatus("Webbläsaren saknar stöd för position.", true); return; }
  setStatus("Hämtar position…"); $("#find").disabled = true;
  const q = new URLSearchParams(location.search), tl = parseFloat(q.get("lat")), tn = parseFloat(q.get("lon"));
  const ok = async g => {
    pos = { lat: g.coords.latitude, lon: g.coords.longitude, acc: Math.round(g.coords.accuracy) };
    showMe(pos.lat, pos.lon, pos.acc);
    setStatus("Frågar Naturvårdsverket…");
    const bb = `${pos.lat},${pos.lon},${pos.lat},${pos.lon},urn:ogc:def:crs:EPSG::4258`;
    const url = `${CFG.wfs}?service=WFS&version=2.0.0&request=GetFeature&typeNames=ps:ProtectedSite&count=20&outputFormat=application/json&bbox=${bb}`;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(), seen = new Set();
      hits = (j.features || []).map(flat).filter(h => !seen.has(h.key) && seen.add(h.key));
      await fillNvrid(hits, pos);
      const acc = pos.acc > 50 ? ` Osäker position (±${pos.acc} m), vänta gärna en stund och försök igen.` : ` Noggrannhet ±${pos.acc} m.`;
      setStatus((hits.length ? "" : "Du står inte inom något skyddat område.") + acc, pos.acc > 50);
      render();
    } catch (e) {
      setStatus(`Kunde inte hämta träffar (${e.message}). Vid ett CORS-fel måste anropet gå via Apps Script.`, true);
    }
    $("#find").disabled = false;
  };
  if (!isNaN(tl) && !isNaN(tn)) return ok({ coords: { latitude: tl, longitude: tn, accuracy: 5 } });
  navigator.geolocation.getCurrentPosition(ok, err => { setStatus("Ingen position: " + err.message, true); $("#find").disabled = false; },
  { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

const hitHtml = h => {
  const done = visits.some(v => v.scheme === h.scheme && v.id === h.id && v.datum.slice(0,10) === new Date().toISOString().slice(0,10));
  return `<div class="hit ${h.skydd ? "" : "other"} ${done ? "done" : ""}"><div><strong>${esc(h.name)}</strong><span>${esc(h.typ)}</span></div>
  <button data-k="${esc(h.key)}" ${done ? "disabled" : ""}>${done ? "Loggat idag" : "Logga besök"}</button></div>`;
};

let map, meL = [], pins, overlays = {};
function initMap(){
  if (!window.L) { $("#map").textContent = "Kartan kunde inte laddas."; return; }
  map = L.map("map").setView([62, 15], 5);
  const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17,
    attribution: "Kartdata © OpenStreetMap-bidragsgivare, SRTM | Stil © OpenTopoMap (CC-BY-SA)" }).addTo(map);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 18, maxNativeZoom: 17, attribution: "Bilder © Esri, Maxar, Earthstar Geographics m.fl." });
  const wms = l => L.tileLayer.wms(CFG.wms, { layers: l, format: "image/png", transparent: true, opacity: .8, attribution: "Naturvårdsverket" });
  const over = overlays = { "Naturreservat": wms("PS.ProtectedSites.NR"), "Nationalparker": wms("PS.ProtectedSites.NP") };
  Object.values(over).forEach(l => l.addTo(map));
  ctl = L.control.layers({ "OpenTopoMap": topo, "Satellit (Esri)": sat }, over).addTo(map);
  hiGroup = L.layerGroup().addTo(map);
  ctl.addOverlay(hiGroup, "Besökta områden");
  pins = L.layerGroup().addTo(map);
  map.on("click", infoClick);
}
function showMe(lat, lon, acc){
  if (!map) return;
  meL.forEach(l => map.removeLayer(l));
  const ll = [lat, lon];
  meL = [L.circle(ll, { radius: acc, color: "#2b6cb0", weight: 1, fillOpacity: .1, interactive: false }).addTo(map),
         L.circleMarker(ll, { radius: 8, color: "#fff", weight: 2, fillColor: "#2b6cb0", fillOpacity: 1, interactive: false }).addTo(map)];
  map.setView(ll, Math.max(map.getZoom(), 14));
}
function locate(){
  const q = new URLSearchParams(location.search), tl = parseFloat(q.get("lat")), tn = parseFloat(q.get("lon"));
  if (!isNaN(tl) && !isNaN(tn)) return showMe(tl, tn, 5);
  if (!navigator.geolocation) return setStatus("Webbläsaren saknar stöd för position.", true);
  navigator.geolocation.getCurrentPosition(g => showMe(g.coords.latitude, g.coords.longitude, g.coords.accuracy),
    e => setStatus("Ingen position: " + e.message, true), { enableHighAccuracy: true, timeout: 20000 });
}
function drawPins(){
  if (!pins) return;
  pins.clearLayers();
  const seen = new Set();
  visits.forEach(v => {
    const lat = +v.lat, lon = +v.lon, k = v.scheme + ":" + v.id;
    if (isNaN(lat) || isNaN(lon) || seen.has(k)) return;
    seen.add(k);
    L.circleMarker([lat, lon], { radius: 7, color: "#7a5c3e", weight: 2, fillColor: "#7a5c3e", fillOpacity: .8, bubblingMouseEvents: false })
      .bindPopup(`<strong>${esc(v.namn)}</strong><br>${esc(v.typ)}`).addTo(pins);
  });
}

// Besökta objekt färgas av servern: WMS-lagret ritas om med filter (cql_filter) och egen stil (sld_body).
let ctl, hiGroup;
const hi = {};
const LAGER = { "Nationalpark": "PS.ProtectedSites.NP", "Naturreservat": "PS.ProtectedSites.NR" };
const sldFor = n => `<StyledLayerDescriptor version="1.0.0" xmlns="http://www.opengis.net/sld"><NamedLayer><Name>${n}</Name><UserStyle><FeatureTypeStyle><Rule><PolygonSymbolizer><Fill><CssParameter name="fill">#c2410c</CssParameter><CssParameter name="fill-opacity">0.45</CssParameter></Fill><Stroke><CssParameter name="stroke">#c2410c</CssParameter><CssParameter name="stroke-width">2</CssParameter></Stroke></PolygonSymbolizer></Rule></FeatureTypeStyle></UserStyle></NamedLayer></StyledLayerDescriptor>`;
function updateHighlight(){
  if (!map) return;
  const q = x => "'" + String(x).replace(/'/g, "''") + "'";
  Object.values(LAGER).forEach(layer => {
    const ids = new Set(), names = new Set();
    visits.forEach(v => {
      if (LAGER[v.typ] !== layer) return;
      if (v.nvrid) ids.add(String(v.nvrid)); else names.add(v.namn); // äldre rader saknar nvrid: matcha på namn
    });
    const parts = [];
    if (ids.size) parts.push(`nvrid IN (${[...ids].map(q).join(",")})`);
    if (names.size) parts.push(`namn IN (${[...names].map(q).join(",")})`);
    if (!parts.length) { if (hi[layer]) { hiGroup.removeLayer(hi[layer]); delete hi[layer]; } return; }
    const params = { cql_filter: parts.join(" OR "), sld_body: sldFor(layer) };
    if (hi[layer]) hi[layer].setParams(params);
    else { hi[layer] = L.tileLayer.wms(CFG.wms, { layers: layer, format: "image/png", transparent: true, opacity: .9, attribution: "Naturvårdsverket", ...params }); hiGroup.addLayer(hi[layer]); }
  });
}

// NVR-id finns inte alltid i INSPIRE-namnet. Hämta det från NV:s WMS-skikt (GetFeatureInfo) i stället.
async function nvrAt(lat, lon, d = 0.0005, lager = LAGER){
  const out = [];
  await Promise.all(Object.entries(lager).map(async ([typ, layer]) => {
    const u = `${CFG.wms}?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=${layer}&query_layers=${layer}&styles=` +
      `&crs=EPSG:4326&bbox=${lat-d},${lon-d},${lat+d},${lon+d}&width=101&height=101&i=50&j=50&info_format=application/json&feature_count=10`;
    try { const j = await (await fetch(u)).json(); (j.features || []).forEach(f => out.push({ typ, ...f.properties })); }
    catch (e) { console.warn("GetFeatureInfo", layer, e); }
  }));
  return out;
}
async function fillNvrid(list, p){
  if (!list.some(h => h.skydd && !h.nvrid)) return;
  const nvr = await nvrAt(p.lat, p.lon);
  console.log("NVR-objekt vid position:", nvr);
  const get = (o, k) => o[k] ?? o[k.toUpperCase()] ?? "";
  list.forEach(h => {
    if (!h.skydd || h.nvrid) return;
    const same = nvr.filter(n => n.typ === h.typ);
    const m = same.find(n => String(get(n, "namn")).toLowerCase() === h.name.toLowerCase()) || (same.length === 1 ? same[0] : null);
    if (m) h.nvrid = String(get(m, "nvrid"));
  });
}

// Infoklick: fråga NV:s WMS vad som finns där man klickade och visa namn och besöksstatus.
const OVERLAY_TYP = { "Naturreservat": "Naturreservat", "Nationalparker": "Nationalpark" };
async function infoClick(e){
  const lager = {};
  Object.entries(overlays).forEach(([namn, l]) => { if (map.hasLayer(l)) lager[OVERLAY_TYP[namn]] = LAGER[OVERLAY_TYP[namn]]; });
  if (!Object.keys(lager).length) return;
  const p = map.latLngToContainerPoint(e.latlng), a = map.containerPointToLatLng(p.subtract([4, 4]));
  const d = Math.max(Math.abs(a.lat - e.latlng.lat), Math.abs(a.lng - e.latlng.lng));
  const popup = L.popup().setLatLng(e.latlng).setContent("Hämtar…").openOn(map);
  const res = await nvrAt(e.latlng.lat, e.latlng.lng, d, lager);
  console.log("Infoklick:", res);
  if (!res.length) { map.closePopup(popup); return; }
  const get = (o, k) => o[k] ?? o[k.toUpperCase()] ?? "";
  const dat = t => new Date(t).toLocaleDateString("sv-SE");
  popup.setContent(res.map(o => {
    const namn = get(o, "namn"), id = String(get(o, "nvrid"));
    const mine = visits.filter(v => (id && String(v.nvrid) === id) || (v.typ === o.typ && v.namn === namn));
    const status = mine.length
      ? `Besökt ${mine.length} ${mine.length > 1 ? "gånger" : "gång"}, senast ${dat(Math.max(...mine.map(v => new Date(v.datum).getTime())))}`
      : "Inte besökt än";
    return `<strong>${esc(namn || "Namnlöst område")}</strong><br>${esc(o.typ)}${id ? " · NVR-id " + esc(id) : ""}<br><em>${status}</em>`;
  }).join("<hr>"));
}

const ORDER = ["Nationalpark", "Naturreservat", "Natura 2000", "Ramsar", "Biosfärområde"];
function grouped(){
  const m = new Map();
  visits.forEach(v => {
    const k = v.scheme + ":" + v.id, t = new Date(v.datum).getTime();
    const e = m.get(k) || { namn: v.namn, typ: v.typ, n: 0, senast: t };
    e.n++; if (t > e.senast) e.senast = t; m.set(k, e);
  });
  const g = {};
  m.forEach(e => (g[e.typ] = g[e.typ] || []).push(e));
  const pos = t => { const i = ORDER.indexOf(t); return i < 0 ? 99 : i; };
  return Object.entries(g).sort(([a], [b]) => pos(a) - pos(b) || a.localeCompare(b, "sv"));
}

function render(){
  const main = hits.filter(h => h.skydd), rest = hits.filter(h => !h.skydd);
  $("#hits").innerHTML = main.map(hitHtml).join("");
  $("#other").innerHTML = rest.map(hitHtml).join("");
  const m = $("#more"); m.hidden = !rest.length;
  m.textContent = ($("#other").hidden ? "Visa " : "Dölj ") + rest.length + " andra skyddsformer";
  const seen = new Set(visits.map(v => v.scheme + ":" + v.id));
  $("#vb").textContent = `${$("#visits").hidden ? "Visa" : "Dölj"} mina besök (${seen.size} platser)`;
  const dat = t => new Date(t).toLocaleDateString("sv-SE");
  $("#visits").innerHTML = visits.length ? grouped().map(([typ, list]) =>
    `<h3>${esc(typ)} <span>(${list.length})</span></h3>` +
    list.sort((a, b) => a.namn.localeCompare(b.namn, "sv")).map(e =>
      `<div class="v"><div>${esc(e.namn)}</div><span>${e.n > 1 ? e.n + " besök · senast " : ""}${dat(e.senast)}</span></div>`).join("")).join("")
    : `<p><span style="color:var(--mute)">Inga besök än. Tryck på Var är jag? när du är ute.</span></p>`;
  drawPins();
  updateHighlight();
}

async function logVisit(key){
  const h = hits.find(x => x.key === key); if (!h) return;
  const row = { datum: new Date().toISOString(), user, id: h.id, scheme: h.scheme, namn: h.name, typ: h.typ, lat: pos.lat, lon: pos.lon, acc: pos.acc, nvrid: h.nvrid };
  visits.unshift(row); store.set("visits:" + user, visits); render();
  if (CFG.sheet) {
    try { await fetch(CFG.sheet, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(row) }); }
    catch { setStatus("Sparades på enheten men inte i Google Sheets.", true); }
  }
}

async function sync(){
  if (!CFG.sheet || !user) return;
  try {
    const u = user, r = await fetch(CFG.sheet + "?user=" + encodeURIComponent(u));
    const rows = await r.json();
    if (Array.isArray(rows) && u === user) { visits = rows; store.set("visits:" + u, visits); render(); }
  } catch { setStatus("Kunde inte läsa loggen från Google Sheets, visar det som finns på enheten.", true); }
}

document.addEventListener("click", e => { const k = e.target.dataset?.k; if (k) logVisit(k); });
$("#find").addEventListener("click", find);
$("#more").addEventListener("click", () => { $("#other").hidden = !$("#other").hidden; render(); });
$("#user").value = user;
$("#user").addEventListener("change", e => setUser(e.target.value));
$("#vb").addEventListener("click", async () => {
  const d = $("#visits"); d.hidden = !d.hidden;
  if (!d.hidden) await sync();
  render();
});
$("#loc").addEventListener("click", locate);
initMap(); render(); sync();
</script>
</body>
</html>
