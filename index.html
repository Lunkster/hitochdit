<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit och Dit</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>try { if (JSON.parse(localStorage.getItem("tema")) === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<style>
:root{--bg:#eef0ea;--card:#f9faf6;--ink:#22302b;--mute:#5f6d66;--line:#c9d1c4;--moss:#4f6b4a;--btn:#4f6b4a;--bark:#7a5c3e;--warn:#9a4a2b;--top:#4f6b4a;color-scheme:light}
/* Mörkt läge: samma mossgröna familj, mörka ytor */
:root[data-theme=dark]{--bg:#141c18;--card:#1c2621;--ink:#e3e8e1;--mute:#9aa79f;--line:#33423a;--moss:#8fb285;--btn:#5a7a53;--bark:#c29a6e;--warn:#ec9068;--top:#2f4430;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1rem 3rem}
.topbar{background:var(--top);color:#fff;display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;position:sticky;top:0;z-index:1000;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.topbar .flag{width:1.9rem;height:1.2rem;border-radius:2px;flex:none}
.topbar h1{margin:0;font:600 1.05rem/1.2 "Iowan Old Style",Charter,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
@media (max-width:360px){.topbar h1 span{display:none}}
h1{font:600 1.9rem/1.15 "Iowan Old Style",Charter,Georgia,serif;margin:.2rem 0 1rem}
h2{font:600 1.15rem/1.3 "Iowan Old Style",Charter,Georgia,serif;margin:2rem 0 .5rem}
label{display:block;color:var(--mute);font-size:.9rem;margin-bottom:.25rem}
input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--btn);padding:.65rem 1rem;background:var(--btn);color:#fff}
button.ghost{border-color:var(--moss)}
button.ghost{background:transparent;color:var(--moss)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--bark);outline-offset:2px}
#find{width:100%;margin:1rem 0 .5rem;padding:.9rem;font-size:1.05rem}
#status{color:var(--mute);min-height:1.5rem;margin:.25rem 0}
#status.warn,.err{color:var(--warn)}
.hit{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);border-radius:6px;padding:.8rem 1rem;margin:.6rem 0;display:flex;gap:.75rem;align-items:center}
.hit.other{border-left-color:var(--line)}
.hit div{flex:1;min-width:0}
.hit strong{display:block;overflow-wrap:anywhere}
.hit span,.v span{color:var(--mute);font-size:.9rem}
.hit.done{border-left-color:var(--bark)}
.v{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
#more{margin-top:.5rem}
#map{position:relative;height:38vh;min-height:240px;max-height:440px;border:1px solid var(--line);border-radius:6px;margin-top:.6rem;background:var(--card);color:var(--mute)}
#map.stor{height:78vh;max-height:none}
.karthint{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;
  background:rgba(34,48,43,.55);color:#fff;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s}
.karthint.visa{opacity:1}
.leaflet-bar a.storknapp{font-size:1.1rem;line-height:30px}
#loc{width:100%}
h3{font:600 1rem/1.3 "Iowan Old Style",Charter,Georgia,serif;margin:1.3rem 0 .1rem}
button.goto{background:none;border:0;padding:0;color:var(--moss);text-align:left;font:inherit;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:.5rem}.row input{flex:1}
#who{display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:var(--mute);margin:0}
button.small{padding:.35rem .7rem;font-size:.9rem}
.btns{display:flex;gap:.4rem}
#nameform{margin-top:.6rem}
button.tiny{padding:.1rem .5rem;font-size:.85rem;margin-left:.4rem}
.vd{padding:.2rem 0 .6rem 1rem;border-bottom:1px solid var(--line)}
.vd div{display:flex;justify-content:space-between;align-items:center;padding:.2rem 0;color:var(--mute);font-size:.9rem}
.osm-nedtonad{filter:saturate(.3) brightness(1.06) contrast(.92)}
select.basval{font:inherit;font-size:.85rem;padding:.3rem .4rem;border:2px solid rgba(0,0,0,.2);border-radius:4px;background:var(--card);color:var(--ink);max-width:11rem}
/* Mörk bakgrundskarta: OSM inverterad och dämpad, lätt genomskinlig mot mörkgrön botten (#map-bakgrund) */
.osm-mork{filter:invert(.86) hue-rotate(180deg) saturate(.6) brightness(.9) contrast(1.15)}
/* Leaflet i mörkt läge */
[data-theme=dark] .leaflet-popup-content-wrapper,[data-theme=dark] .leaflet-popup-tip,[data-theme=dark] .leaflet-control-layers,
[data-theme=dark] .leaflet-bar a{background:var(--card);color:var(--ink);border-color:var(--line)}
[data-theme=dark] .leaflet-control-attribution{background:rgba(28,38,33,.85);color:var(--mute)}
[data-theme=dark] .leaflet-control-attribution a,[data-theme=dark] .leaflet-popup-content a{color:var(--moss)}
/* Inställningar */
.gear{margin-left:auto;background:none;border:0;padding:.25rem;color:#fff;line-height:0}
.gear svg{width:1.5rem;height:1.5rem}
#settings{position:fixed;top:3.4rem;right:.75rem;z-index:1200;width:min(22rem,calc(100vw - 1.5rem));background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:1rem 1.1rem 1.1rem}
#settings h2{margin:0 0 .6rem}
#settings h3{margin:1rem 0 .4rem}
#settings .stang{position:absolute;top:.6rem;right:.6rem}
.val{display:flex;gap:.5rem}
.val label{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;margin:0;padding:.55rem;border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer}
.val input{width:auto;margin:0;accent-color:var(--moss)}
.val label:has(input:checked){border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
#acct{color:var(--mute);margin:.2rem 0 .6rem;overflow-wrap:anywhere}
h3 span{color:var(--mute);font:400 .9rem system-ui,sans-serif}
</style>
</head>
<body>
<header class="topbar">
  <svg class="flag" viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="10" fill="#006aa7"/><rect x="5" width="2" height="10" fill="#fecc02"/><rect y="4" width="16" height="2" fill="#fecc02"/></svg>
  <h1>Hit och Dit<span>: Utforska Sverige</span></h1>
  <button id="gear" class="gear" aria-label="Inställningar" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div id="settings" role="dialog" aria-label="Inställningar" hidden>
  <button class="ghost small stang" id="stang" aria-label="Stäng">✕</button>
  <h2>Inställningar</h2>
  <h3>Konto</h3>
  <p id="acct">Inte inloggad.</p>
  <form id="nameform" hidden>
    <label for="uname">Användarnamn <span style="color:var(--mute)">(visas i appen och i framtida topplistor)</span></label>
    <div class="row"><input id="uname" maxlength="30" autocomplete="nickname" required placeholder="t.ex. Reservatsjägaren"><button>Spara</button></div>
  </form>
  <div class="btns" id="acctbtns" hidden><button id="rename" class="ghost small">Byt namn</button><button id="logout" class="ghost small">Logga ut</button></div>
  <h3>Utseende</h3>
  <div class="val" role="radiogroup" aria-label="Tema">
    <label><input type="radio" name="tema" value="light"> Ljust</label>
    <label><input type="radio" name="tema" value="dark"> Mörkt</label>
  </div>
</div>
<main>
<section id="auth">
  <form id="login" hidden>
    <label for="email">Logga in med e-post</label>
    <div class="row"><input id="email" type="email" autocomplete="email" required placeholder="namn@exempel.se"><button>Skicka länk</button></div>
  </form>
  <p id="who" hidden><span></span></p>
</section>
<button id="find">Var är jag?</button>
<p id="status" aria-live="polite"></p>
<div id="hits"></div>
<button id="more" class="ghost" hidden></button>
<div id="other" hidden></div>
<h2>Karta</h2>
<button id="loc" class="ghost">Centrera på min position</button>
<div id="map" role="region" aria-label="Karta"></div>
<button id="vb" class="ghost" style="width:100%;margin-top:1.5rem">Mina besök</button>
<div id="visits" hidden></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ---- Inställningar ----
const CFG = {
  wfs: "https://geodata.naturvardsverket.se/inspire/ps/wfs",
  wms: "https://geodata.naturvardsverket.se/inspire/ps-nvr/ows",
  // Supabase: URL och publishable key får ligga öppet – skyddet är Row Level Security i databasen.
  supabaseUrl: "https://jihglrfinqsmigpxzfhk.supabase.co",
  supabaseKey: "sb_publishable_v6uCzg15rdSyO4LAmNWaJA_BtOdAJBi"
};
const sb = window.supabase?.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true } });

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let user = null, visits = [], pos = null, hits = [];   // user = { id, email, namn } när inloggad
const oppna = new Set();   // platser i "Mina besök" som är utfällda
function setUser(u){
  if ((u?.id || null) === (user?.id || null)) return;
  user = u ? { id: u.id, email: u.email } : null;
  visits = user ? store.get("visits:" + user.id, []) : [];
  $("#login").hidden = !!user; $("#who").hidden = !user; $("#nameform").hidden = true; $("#acctbtns").hidden = !user;
  showWho();
  if (pins) pins.clearLayers();
  render(); sync(); if (user) loadProfile();
}
function showWho(){
  if (user) $("#who > span").textContent = "Inloggad som " + (user.namn || user.email);
  $("#acct").textContent = user ? `${user.namn || "(inget användarnamn)"} · ${user.email}` : "Inte inloggad. Logga in med e-post på startsidan.";
}

async function loadProfile(){
  const u = user.id;
  let { data, error } = await sb.from("profiler").select("namn").eq("id", u).maybeSingle();
  if (!error && !data) ({ error } = await sb.from("profiler").insert({ id: u }));   // om triggern saknas
  if (error) { console.error("Profil", error); return; }
  if (u !== user?.id) return;
  user.namn = data?.namn || "";
  showWho();
  if (!user.namn) { visaInst(true); $("#nameform").hidden = false; $("#uname").focus(); setStatus("Välj ett användarnamn."); }
}
async function saveName(e){
  e.preventDefault();
  const namn = $("#uname").value.trim();
  if (namn.length < 2) { setStatus("Namnet behöver minst två tecken.", true); return; }
  const { error } = await sb.from("profiler").update({ namn }).eq("id", user.id);
  if (error) { setStatus(error.code === "23505" ? `Namnet ”${namn}” är redan upptaget.` : "Kunde inte spara namnet: " + error.message, true); return; }
  user.namn = namn; showWho(); $("#nameform").hidden = true; setStatus("Användarnamnet är sparat.");
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function label(scheme, des){
  if (scheme === "IUCN") return des === "nationalPark" ? "Nationalpark" : "Naturreservat";
  if (scheme === "natura2000") return "Natura 2000";
  if (scheme === "ramsar") return "Ramsar";
  if (scheme.startsWith("UNESCO")) return "Biosfärområde";
  return des || scheme || "Skyddat område";
}

function flat(f){
  const p = f.properties || {}, d = p.siteDesignation?.DesignationType || {};
  const lid = p.inspireID?.localId || f.id;
  const n2k = lid.match(/^(SE\.SWEPA\.SE\d+)\.\d+$/); // .1 och .2 är två direktiv för samma område
  const scheme = d.designationScheme?.["@href"] || "", des = d.designation?.["@href"] || "";
  const raw = p.siteName?.GeographicalName?.spelling?.text || "Namnlöst område";
  const rn = raw.match(/^(\d{5,})\s+(.*)$/);
  const id = n2k ? n2k[1] : lid;
  return { key: scheme + ":" + id, id, scheme, des, name: rn ? rn[2] : raw, typ: label(scheme, des), skydd: scheme === "IUCN", nvrid: rn ? rn[1] : "" };
}

function setStatus(t, warn){ const s = $("#status"); s.textContent = t; s.className = warn ? "warn" : ""; }

function find(){
  if (!user) { setStatus("Logga in först, så att besöken sparas på ditt konto.", true); $("#email").focus(); return; }
  if (!navigator.geolocation) { setStatus("Webbläsaren saknar stöd för position.", true); return; }
  setStatus("Hämtar position…"); $("#find").disabled = true;
  const q = new URLSearchParams(location.search), tl = parseFloat(q.get("lat")), tn = parseFloat(q.get("lon"));
  const ok = async g => {
    pos = { lat: g.coords.latitude, lon: g.coords.longitude, acc: Math.round(g.coords.accuracy) };
    showMe(pos.lat, pos.lon, pos.acc);
    setStatus("Frågar Naturvårdsverket…");
    const bb = `${pos.lat},${pos.lon},${pos.lat},${pos.lon},urn:ogc:def:crs:EPSG::4258`;
    const url = `${CFG.wfs}?service=WFS&version=2.0.0&request=GetFeature&typeNames=ps:ProtectedSite&count=20&outputFormat=application/json&bbox=${bb}`;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(), seen = new Set();
      hits = (j.features || []).map(flat).filter(h => !seen.has(h.key) && seen.add(h.key));
      await fillNvrid(hits, pos);
      const acc = pos.acc > 50 ? ` Osäker position (±${pos.acc} m), vänta gärna en stund och försök igen.` : ` Noggrannhet ±${pos.acc} m.`;
      setStatus((hits.length ? "" : "Du står inte inom något skyddat område.") + acc, pos.acc > 50);
      render();
    } catch (e) {
      setStatus(`Kunde inte hämta träffar (${e.message}). Vid ett CORS-fel måste anropet gå via Apps Script.`, true);
    }
    $("#find").disabled = false;
  };
  if (!isNaN(tl) && !isNaN(tn)) return ok({ coords: { latitude: tl, longitude: tn, accuracy: 5 } });
  navigator.geolocation.getCurrentPosition(ok, err => { setStatus("Ingen position: " + err.message, true); $("#find").disabled = false; },
  { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

const hitHtml = h => {
  const done = visits.some(v => v.scheme === h.scheme && v.id === h.id && v.datum.slice(0,10) === new Date().toISOString().slice(0,10));
  return `<div class="hit ${h.skydd ? "" : "other"} ${done ? "done" : ""}"><div><strong>${esc(h.name)}</strong><span>${esc(h.typ)}</span></div>
  <button data-k="${esc(h.key)}" ${done ? "disabled" : ""}>${done ? "Loggat idag" : "Logga besök"}</button></div>`;
};

let map, meL = [], pins, overlays = {}, BAS = {}, basNamn = "", basSel;
function bytBas(n){
  if (!map || !BAS[n] || n === basNamn) return;
  map.removeLayer(BAS[basNamn]); basNamn = n; BAS[n].addTo(map); store.set("bas", n);
  if (basSel) basSel.value = n;
}

// ---- Tema (ljust är förval) ----
const tema = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";
function setTema(t){
  if (t === "dark") document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  store.set("tema", t);
  document.querySelectorAll("input[name=tema]").forEach(r => r.checked = r.value === t);
  // Byt till passande bakgrundskarta om man har en av standardkartorna
  if (t === "dark" && ["Nedtonad (OSM)", "Ljusgrå (Esri)"].includes(basNamn)) bytBas("Mörk (OSM)");
  if (t === "light" && basNamn === "Mörk (OSM)") bytBas("Nedtonad (OSM)");
}
function visaInst(vis){
  const p = $("#settings"); p.hidden = vis === undefined ? !p.hidden : !vis;
  $("#gear").setAttribute("aria-expanded", String(!p.hidden));
}
function initMap(){
  if (!window.L) { $("#map").textContent = "Kartan kunde inte laddas."; return; }
  // Kartan ska inte fånga sidans scroll: på mobil flyttas den med två fingrar, på dator zoomar hjulet först efter klick i kartan.
  const touch = L.Browser.mobile || matchMedia("(pointer: coarse)").matches;
  map = L.map("map", { dragging: !touch, tap: false, scrollWheelZoom: false }).setView([62, 15], 5);
  map.on("click focus", () => map.scrollWheelZoom.enable());
  map.on("mouseout blur", () => map.scrollWheelZoom.disable());
  const hint = L.DomUtil.create("div", "karthint", map.getContainer());
  hint.textContent = "Använd två fingrar för att flytta kartan";
  let hintT;
  map.getContainer().addEventListener("touchmove", e => {
    if (map.dragging.enabled()) return;
    if (e.touches.length > 1) { hint.classList.remove("visa"); return; }   // två fingrar: Leaflets pinch flyttar och zoomar
    hint.classList.add("visa"); clearTimeout(hintT); hintT = setTimeout(() => hint.classList.remove("visa"), 1200);
  }, { passive: true });
  // Knapp för större/mindre karta. I stort läge flyttas kartan med ett finger.
  const StorCtl = L.Control.extend({ onAdd(){
    const bar = L.DomUtil.create("div", "leaflet-bar"), a = L.DomUtil.create("a", "storknapp", bar);
    a.href = "#"; a.setAttribute("role", "button"); a.title = "Större karta"; a.textContent = "⤢";
    L.DomEvent.disableClickPropagation(bar);
    L.DomEvent.on(a, "click", e => {
      L.DomEvent.preventDefault(e);
      const stor = $("#map").classList.toggle("stor");
      a.title = stor ? "Mindre karta" : "Större karta"; a.textContent = stor ? "⤡" : "⤢";
      if (touch) stor ? map.dragging.enable() : map.dragging.disable();
      setTimeout(() => { map.invalidateSize(); $("#map").scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
    });
    return bar;
  }});
  new StorCtl({ position: "topleft" }).addTo(map);
  // Bakgrundskartor – den första är förvald
  BAS = {
    // OSM:s standardkarta, nedtonad med CSS-filter (klassen osm-nedtonad). Ingen nyckel behövs.
    "Nedtonad (OSM)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "osm-nedtonad",
      attribution: "Kartdata © OpenStreetMap-bidragsgivare" }),
    "Mörk (OSM)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "osm-mork", opacity: .85,
      attribution: "Kartdata © OpenStreetMap-bidragsgivare" }),
    "Ljusgrå (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, maxNativeZoom: 16, attribution: "Karta © Esri, HERE, Garmin, OpenStreetMap-bidragsgivare" }),
    "Topografisk (OpenTopoMap)": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17,
      attribution: "Kartdata © OpenStreetMap-bidragsgivare, SRTM | Stil © OpenTopoMap (CC-BY-SA)" }),
    "Satellit (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18, maxNativeZoom: 17, attribution: "Bilder © Esri, Maxar, Earthstar Geographics m.fl." })
  };
  Object.values(BAS).forEach(l => l.setZIndex(1));   // bakgrund alltid underst, oavsett när den läggs till
  basNamn = store.get("bas", "");
  if (!BAS[basNamn]) basNamn = tema() === "dark" ? "Mörk (OSM)" : "Nedtonad (OSM)";
  BAS[basNamn].addTo(map);
  // Kompakt väljare för bakgrundskarta (rullgardin) i stället för en lång lista
  const BasCtl = L.Control.extend({
    onAdd(){
      const el = basSel = L.DomUtil.create("select", "basval");
      el.setAttribute("aria-label", "Bakgrundskarta");
      el.innerHTML = Object.keys(BAS).map(n => `<option${n === basNamn ? " selected" : ""}>${n}</option>`).join("");
      L.DomEvent.disableClickPropagation(el);
      el.addEventListener("change", () => bytBas(el.value));
      return el;
    }
  });
  new BasCtl({ position: "topright" }).addTo(map);
  // NV-skikten hämtas som EN bild där servern lägger nationalparker ovanpå reservat.
  // Kryssrutorna styr bara vilka skikt som ingår (layers-parametern), så två bildlager kan inte skymma varandra.
  const nvSkikt = L.tileLayer.wms(CFG.wms, { layers: "PS.ProtectedSites.NR,PS.ProtectedSites.NP", format: "image/png", transparent: true,
    opacity: 1, zIndex: 10, attribution: "Naturvårdsverket" }).addTo(map);
  const over = overlays = { "Naturreservat": L.layerGroup().addTo(map), "Nationalparker": L.layerGroup().addTo(map) };
  const NV_NAMN = { "Naturreservat": "PS.ProtectedSites.NR", "Nationalparker": "PS.ProtectedSites.NP" };
  const nvUppdatera = () => {
    const l = Object.keys(over).filter(n => map.hasLayer(over[n])).map(n => NV_NAMN[n]);
    if (!l.length) { map.removeLayer(nvSkikt); return; }
    nvSkikt.setParams({ layers: l.join(",") }); if (!map.hasLayer(nvSkikt)) nvSkikt.addTo(map);
  };
  map.on("overlayadd overlayremove", e => { if (NV_NAMN[e.name]) nvUppdatera(); });
  ctl = L.control.layers(null, over, { collapsed: true }).addTo(map);
  hiGroup = L.layerGroup().addTo(map);
  ctl.addOverlay(hiGroup, "Besökta områden");
  pins = L.layerGroup().addTo(map);
  map.on("click", infoClick);
}
function showMe(lat, lon, acc){
  if (!map) return;
  meL.forEach(l => map.removeLayer(l));
  const ll = [lat, lon];
  meL = [L.circle(ll, { radius: acc, color: "#2b6cb0", weight: 1, fillOpacity: .1, interactive: false }).addTo(map),
         L.circleMarker(ll, { radius: 8, color: "#fff", weight: 2, fillColor: "#2b6cb0", fillOpacity: 1, interactive: false }).addTo(map)];
  map.setView(ll, Math.max(map.getZoom(), 14));
}
function locate(){
  const q = new URLSearchParams(location.search), tl = parseFloat(q.get("lat")), tn = parseFloat(q.get("lon"));
  if (!isNaN(tl) && !isNaN(tn)) return showMe(tl, tn, 5);
  if (!navigator.geolocation) return setStatus("Webbläsaren saknar stöd för position.", true);
  navigator.geolocation.getCurrentPosition(g => showMe(g.coords.latitude, g.coords.longitude, g.coords.accuracy),
    e => setStatus("Ingen position: " + e.message, true), { enableHighAccuracy: true, timeout: 20000 });
}
function drawPins(){
  if (!pins) return;
  pins.clearLayers();
  const seen = new Set();
  visits.forEach(v => {
    const lat = +v.lat, lon = +v.lon, k = v.scheme + ":" + v.id;
    if (isNaN(lat) || isNaN(lon) || seen.has(k)) return;
    seen.add(k);
    L.circleMarker([lat, lon], { radius: 7, color: "#7a5c3e", weight: 2, fillColor: "#7a5c3e", fillOpacity: .8, bubblingMouseEvents: false })
      .bindPopup(`<strong>${esc(v.namn)}</strong><br>${esc(v.typ)}`).addTo(pins);
  });
}

// Besökta objekt: ytorna hämtas en gång via WFS (på NVR-id) och ritas av appen.
// Reserv: besök utan NVR-id, eller ytor som inte gick att hämta, färgas av servern via WMS (cql_filter + sld_body).
let ctl, hiGroup;
const hi = {};
const LAGER = { "Nationalpark": "PS.ProtectedSites.NP", "Naturreservat": "PS.ProtectedSites.NR" };
const FARG = "#c2410c";
const sldFor = n => `<StyledLayerDescriptor version="1.0.0" xmlns="http://www.opengis.net/sld"><NamedLayer><Name>${n}</Name><UserStyle><FeatureTypeStyle><Rule><PolygonSymbolizer><Fill><CssParameter name="fill">${FARG}</CssParameter><CssParameter name="fill-opacity">0.45</CssParameter></Fill><Stroke><CssParameter name="stroke">${FARG}</CssParameter><CssParameter name="stroke-width">2</CssParameter></Stroke></PolygonSymbolizer></Rule></FeatureTypeStyle></UserStyle></NamedLayer></StyledLayerDescriptor>`;
const sq = x => "'" + String(x).replace(/'/g, "''") + "'";
const prop = (o, k) => o?.[k] ?? o?.[k.toUpperCase()] ?? "";
const shapes = {}, failed = new Set();   // nvrid -> Leaflet-lager, resp. id som inte gick att hämta
let loading = false;

// Sverige: lat 55–69, lon 10–24. Vänd koordinaterna om servern skickar lat/lon i stället för lon/lat.
const toLL = c => c[0] > 40 ? L.latLng(c[0], c[1]) : L.latLng(c[1], c[0]);

function besokStatus(id, namn, typ){
  const dat = t => new Date(t).toLocaleDateString("sv-SE");
  const mine = visits.filter(v => (id && String(v.nvrid) === String(id)) || (v.typ === typ && v.namn === namn));
  return mine.length
    ? `Besökt ${mine.length} ${mine.length > 1 ? "gånger" : "gång"}, senast ${dat(Math.max(...mine.map(v => new Date(v.datum).getTime())))}`
    : "Inte besökt än";
}

async function loadShapes(){
  let nytt = false;
  for (const [typ, layer] of Object.entries(LAGER)) {
    const ids = [...new Set(visits.filter(v => v.typ === typ && v.nvrid).map(v => String(v.nvrid)))]
      .filter(id => !shapes[id] && !failed.has(id));
    if (!ids.length) continue;
    const u = `${CFG.wms}?service=WFS&version=1.0.0&request=GetFeature&typeName=${layer}&outputFormat=application/json&srsName=EPSG:4326` +
      `&CQL_FILTER=` + encodeURIComponent(`nvrid IN (${ids.map(sq).join(",")})`);
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(), per = {};
      (j.features || []).forEach(f => { const id = String(prop(f.properties, "nvrid")); (per[id] = per[id] || []).push(f); });
      Object.entries(per).forEach(([id, fs]) => {
        const namn = prop(fs[0].properties, "namn");
        shapes[id] = L.geoJSON({ type: "FeatureCollection", features: fs }, {
          coordsToLatLng: toLL,
          style: { color: FARG, weight: 2, fillColor: FARG, fillOpacity: .35 },
          bubblingMouseEvents: false
        }).bindPopup(() => `<strong>${esc(namn)}</strong><br>${esc(typ)} · NVR-id ${esc(id)}<br><em>${besokStatus(id, namn, typ)}</em>`);
        nytt = true;
      });
      ids.forEach(id => { if (!shapes[id]) failed.add(id); });
      console.log(`Ytor ${typ}:`, Object.keys(per).length, "hämtade av", ids.length);
    } catch (e) {
      console.warn("Kunde inte hämta ytor via WFS, använder WMS-färgning", layer, e);
      ids.forEach(id => failed.add(id));
      nytt = true;
    }
  }
  return nytt;
}

function updateHighlight(){
  if (!map) return;
  // 1. Egna ytor
  const aktuella = new Set(visits.filter(v => v.nvrid).map(v => String(v.nvrid)));
  Object.entries(shapes).forEach(([id, l]) => {
    if (aktuella.has(id)) { if (!hiGroup.hasLayer(l)) hiGroup.addLayer(l); }
    else hiGroup.removeLayer(l);
  });
  // 2. WMS-reserv för det som saknar egen yta
  Object.values(LAGER).forEach(layer => {
    const ids = new Set(), names = new Set();
    visits.forEach(v => {
      if (LAGER[v.typ] !== layer) return;
      if (v.nvrid && shapes[String(v.nvrid)]) return;
      if (v.nvrid && failed.has(String(v.nvrid))) ids.add(String(v.nvrid));
      else if (!v.nvrid) names.add(v.namn); // äldre rader saknar nvrid: matcha på namn
    });
    const parts = [];
    if (ids.size) parts.push(`nvrid IN (${[...ids].map(sq).join(",")})`);
    if (names.size) parts.push(`namn IN (${[...names].map(sq).join(",")})`);
    if (!parts.length) { if (hi[layer]) { hiGroup.removeLayer(hi[layer]); delete hi[layer]; } return; }
    const params = { cql_filter: parts.join(" OR "), sld_body: sldFor(layer) };
    if (hi[layer]) { if (hi[layer].wmsParams.cql_filter !== params.cql_filter) hi[layer].setParams(params); } // rita bara om när urvalet ändrats
    else { hi[layer] = L.tileLayer.wms(CFG.wms, { layers: layer, format: "image/png", transparent: true, opacity: .9, tileSize: 512, zIndex: 20, attribution: "Naturvårdsverket", ...params }); hiGroup.addLayer(hi[layer]); }
  });
  // 3. Hämta saknade ytor i bakgrunden och rita om när de kommit
  if (!loading) { loading = true; loadShapes().then(nytt => { loading = false; if (nytt) updateHighlight(); }); }
}

// NVR-id finns inte alltid i INSPIRE-namnet. Hämta det från NV:s WMS-skikt (GetFeatureInfo) i stället.
async function nvrAt(lat, lon, d = 0.0005, lager = LAGER){
  const out = [];
  await Promise.all(Object.entries(lager).map(async ([typ, layer]) => {
    const u = `${CFG.wms}?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=${layer}&query_layers=${layer}&styles=` +
      `&crs=EPSG:4326&bbox=${lat-d},${lon-d},${lat+d},${lon+d}&width=101&height=101&i=50&j=50&info_format=application/json&feature_count=10`;
    try { const j = await (await fetch(u)).json(); (j.features || []).forEach(f => out.push({ typ, ...f.properties })); }
    catch (e) { console.warn("GetFeatureInfo", layer, e); }
  }));
  return out;
}
async function fillNvrid(list, p){
  if (!list.some(h => h.skydd && !h.nvrid)) return;
  const nvr = await nvrAt(p.lat, p.lon);
  console.log("NVR-objekt vid position:", nvr);
  const get = (o, k) => o[k] ?? o[k.toUpperCase()] ?? "";
  list.forEach(h => {
    if (!h.skydd || h.nvrid) return;
    const same = nvr.filter(n => n.typ === h.typ);
    const m = same.find(n => String(get(n, "namn")).toLowerCase() === h.name.toLowerCase()) || (same.length === 1 ? same[0] : null);
    if (m) h.nvrid = String(get(m, "nvrid"));
  });
}

// Infoklick: fråga NV:s WMS vad som finns där man klickade och visa namn och besöksstatus.
const OVERLAY_TYP = { "Naturreservat": "Naturreservat", "Nationalparker": "Nationalpark" };
async function infoClick(e){
  const lager = {};
  Object.entries(overlays).forEach(([namn, l]) => { if (map.hasLayer(l)) lager[OVERLAY_TYP[namn]] = LAGER[OVERLAY_TYP[namn]]; });
  if (!Object.keys(lager).length) return;
  const p = map.latLngToContainerPoint(e.latlng), a = map.containerPointToLatLng(p.subtract([4, 4]));
  const d = Math.max(Math.abs(a.lat - e.latlng.lat), Math.abs(a.lng - e.latlng.lng));
  const popup = L.popup().setLatLng(e.latlng).setContent("Hämtar…").openOn(map);
  const res = await nvrAt(e.latlng.lat, e.latlng.lng, d, lager);
  console.log("Infoklick:", res);
  if (!res.length) { map.closePopup(popup); return; }
  popup.setContent(res.map(o => {
    const namn = prop(o, "namn"), id = String(prop(o, "nvrid"));
    const status = besokStatus(id, namn, o.typ);
    return `<strong>${esc(namn || "Namnlöst område")}</strong><br>${esc(o.typ)}${id ? " · NVR-id " + esc(id) : ""}<br><em>${status}</em>`;
  }).join("<hr>"));
}

const ORDER = ["Nationalpark", "Naturreservat", "Natura 2000", "Ramsar", "Biosfärområde"];
function grouped(){
  const m = new Map();
  visits.forEach(v => {
    const k = v.scheme + ":" + v.id, t = new Date(v.datum).getTime();
    const e = m.get(k) || { key: k, namn: v.namn, typ: v.typ, n: 0, senast: t, lat: +v.lat, lon: +v.lon, nvrid: "", rader: [] };
    e.rader.push(v);
    if (v.nvrid) e.nvrid = String(v.nvrid);
    e.n++; if (t > e.senast) e.senast = t; m.set(k, e);
  });
  const g = {};
  m.forEach(e => (g[e.typ] = g[e.typ] || []).push(e));
  const pos = t => { const i = ORDER.indexOf(t); return i < 0 ? 99 : i; };
  return Object.entries(g).sort(([a], [b]) => pos(a) - pos(b) || a.localeCompare(b, "sv"));
}

function render(){
  const main = hits.filter(h => h.skydd), rest = hits.filter(h => !h.skydd);
  $("#hits").innerHTML = main.map(hitHtml).join("");
  $("#other").innerHTML = rest.map(hitHtml).join("");
  const m = $("#more"); m.hidden = !rest.length;
  m.textContent = ($("#other").hidden ? "Visa " : "Dölj ") + rest.length + " andra skyddsformer";
  const seen = new Set(visits.map(v => v.scheme + ":" + v.id));
  $("#vb").textContent = `${$("#visits").hidden ? "Visa" : "Dölj"} mina besök (${seen.size} platser)`;
  const dat = t => new Date(t).toLocaleDateString("sv-SE");
  $("#visits").innerHTML = visits.length ? grouped().map(([typ, list]) =>
    `<h3>${esc(typ)} <span>(${list.length})</span></h3>` +
    list.sort((a, b) => a.namn.localeCompare(b.namn, "sv")).map(e =>
      `<div class="v"><div>${isNaN(e.lat) || isNaN(e.lon) ? esc(e.namn) : `<button class="goto" data-lat="${e.lat}" data-lon="${e.lon}" data-id="${esc(e.nvrid)}" data-namn="${esc(e.namn)}" title="Visa på kartan">${esc(e.namn)}</button>`}</div><span>${e.n > 1 ? e.n + " besök · senast " : ""}${dat(e.senast)}<button class="ghost tiny" data-open="${esc(e.key)}" aria-expanded="${oppna.has(e.key)}" title="Visa enskilda besök">${oppna.has(e.key) ? "▴" : "▾"}</button></span></div>` +
      (oppna.has(e.key) ? `<div class="vd">${e.rader.map(r => `<div><span>${new Date(r.datum).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" })}</span>${r.dbid ? `<button class="ghost tiny" data-del="${r.dbid}">Ta bort</button>` : ""}</div>`).join("")}</div>` : "")).join("")).join("")
    : `<p><span style="color:var(--mute)">Inga besök än. Tryck på Var är jag? när du är ute.</span></p>`;
  drawPins();
  updateHighlight();
}

// Databasrad <-> appens format
const fromDb = r => ({ dbid: r.id, datum: r.datum, id: r.objekt_id, scheme: r.scheme, namn: r.namn, typ: r.typ, lat: r.lat, lon: r.lon, acc: r.acc, nvrid: r.nvrid || "" });

async function logVisit(key){
  const h = hits.find(x => x.key === key); if (!h || !user) return;
  const row = { datum: new Date().toISOString(), id: h.id, scheme: h.scheme, namn: h.name, typ: h.typ, lat: pos.lat, lon: pos.lon, acc: pos.acc, nvrid: h.nvrid };
  visits.unshift(row); render();
  const { data: ny, error } = await sb.from("besok").insert({ objekt_id: h.id, scheme: h.scheme, nvrid: h.nvrid || null, namn: h.name, typ: h.typ, lat: pos.lat, lon: pos.lon, acc: pos.acc }).select("id").single();
  if (error) {
    console.error("Kunde inte spara besöket", error);
    visits.shift(); render();
    setStatus("Besöket kunde inte sparas: " + error.message, true);
    return;
  }
  row.dbid = ny.id; store.set("visits:" + user.id, visits); render();
  setStatus(`Besök i ${h.name} sparat.`);
}

async function sync(){
  if (!sb || !user) return;
  const u = user.id;
  const { data, error } = await sb.from("besok").select("*").order("datum", { ascending: false });
  if (error) { console.error(error); setStatus("Kunde inte läsa dina besök, visar det som finns på enheten.", true); return; }
  if (u !== user?.id) return;
  visits = data.map(fromDb); store.set("visits:" + u, visits); render();
}

async function sendLink(e){
  e.preventDefault();
  const email = $("#email").value.trim(); if (!email) return;
  const btn = $("#login button"); btn.disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  btn.disabled = false;
  if (error) setStatus("Kunde inte skicka länken: " + error.message, true);
  else setStatus(`En inloggningslänk är skickad till ${email}. Öppna den på den här enheten.`);
}

document.addEventListener("click", e => {
  const k = e.target.dataset?.k; if (k) logVisit(k);
  const g = e.target.closest?.(".goto"); if (g) gotoVisit(+g.dataset.lat, +g.dataset.lon, g.dataset.namn, g.dataset.id);
  const o = e.target.dataset?.open; if (o) { oppna.has(o) ? oppna.delete(o) : oppna.add(o); render(); }
  const d = e.target.dataset?.del; if (d) delVisit(+d);
});
async function delVisit(dbid){
  const v = visits.find(x => x.dbid === dbid); if (!v) return;
  if (!confirm(`Ta bort besöket i ${v.namn} ${new Date(v.datum).toLocaleDateString("sv-SE")}?`)) return;
  const { error } = await sb.from("besok").delete().eq("id", dbid);
  if (error) { setStatus("Kunde inte ta bort besöket: " + error.message, true); return; }
  visits = visits.filter(x => x.dbid !== dbid); store.set("visits:" + user.id, visits);
  render(); setStatus(`Besöket i ${v.namn} är borttaget.`);
}
function gotoVisit(lat, lon, namn, id){
  if (!map) return;
  $("#map").scrollIntoView({ behavior: "smooth", block: "center" });
  const yta = id && shapes[id];
  if (yta) { map.fitBounds(yta.getBounds(), { padding: [20, 20], maxZoom: 15 }); yta.openPopup(); return; }
  map.setView([lat, lon], 14);
  L.popup().setLatLng([lat, lon]).setContent(`<strong>${esc(namn)}</strong><br><span style="color:var(--mute)">Här loggade du besöket</span>`).openOn(map);
}
$("#find").addEventListener("click", find);
$("#more").addEventListener("click", () => { $("#other").hidden = !$("#other").hidden; render(); });
$("#login").addEventListener("submit", sendLink);
$("#nameform").addEventListener("submit", saveName);
$("#gear").addEventListener("click", () => visaInst());
$("#stang").addEventListener("click", () => visaInst(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") visaInst(false); });
document.addEventListener("click", e => { if (!$("#settings").hidden && !e.target.closest("#settings, #gear")) visaInst(false); });
document.querySelectorAll("input[name=tema]").forEach(r => r.addEventListener("change", () => setTema(r.value)));
document.querySelectorAll("input[name=tema]").forEach(r => r.checked = r.value === tema());
$("#rename").addEventListener("click", () => { $("#uname").value = user?.namn || ""; $("#nameform").hidden = !$("#nameform").hidden; if (!$("#nameform").hidden) $("#uname").focus(); });
$("#logout").addEventListener("click", async () => { await sb.auth.signOut(); visaInst(false); setStatus("Utloggad."); });
$("#vb").addEventListener("click", async () => {
  const d = $("#visits"); d.hidden = !d.hidden;
  if (!d.hidden) await sync();
  render();
});
$("#loc").addEventListener("click", locate);
initMap(); render();
if (!sb) { setStatus("Kunde inte ladda Supabase – kontrollera nätet och ladda om sidan.", true); }
else {
  $("#login").hidden = false;
  sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => setUser(session?.user || null), 0));
}
</script>
